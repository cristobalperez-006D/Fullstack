server:
  port: 0
  address: 0.0.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_cliente
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    config:
      request-connect-timeout: 2000
      request-read-timeout: 5000
      fail-fast: false
    loadbalancer:
      enabled: true