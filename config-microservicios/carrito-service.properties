server.port=0
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# CONFIGURACION DE credenciales de MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_carrito
spring.datasource.username=root
spring.datasource.password=

# CONFIGURACION DE SPRING CON MYSQL (Apagamos logs para velocidad)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timeouts para que no se cuelgue con el Config Server
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=5000
spring.cloud.config.fail-fast=false
spring.cloud.loadbalancer.enabled=true
server.address=0.0.0.0