spring:
  application:
    name: api-gateway
  config:
    # Usamos el nombre del servicio del docker-compose
    import: "optional:configserver:http://config-server:8888"
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
      retry:
        enabled: true
        max-attempts: 10
        initial-interval: 2000
        multiplier: 1.5