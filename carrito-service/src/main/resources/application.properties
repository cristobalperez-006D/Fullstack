spring.application.name=carrito-service
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.uri=http://localhost:8888
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Si no conecta en 2 segundos, aborta la espera al Config Server
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=5000

# Esto ayuda a que el inicio sea más fluido
spring.cloud.config.fail-fast=false
